services:
  polymarket-bot:
    build:
      context: .
    image: polymarket-bot:latest
    container_name: polymarket-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: 8080
      TRADE_HISTORY_CSV: /app/data/trade_history.csv
      TRADE_STORE_BACKEND: ${TRADE_STORE_BACKEND:-mysql}
      MYSQL_HOST: ${MYSQL_HOST:-217.216.110.33}
      MYSQL_PORT: ${MYSQL_PORT:-3310}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app_db}
      MYSQL_USER: ${MYSQL_USER:-app_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "8080:8080"
    volumes:
      - bot-data:/app/data

  dashboard-sim:
    profiles:
      - sim
    build:
      context: .
    image: polymarket-bot:latest
    container_name: polymarket-dashboard-sim
    restart: unless-stopped
    environment:
      DASHBOARD_HOST: 0.0.0.0
      SIM_DASHBOARD_PORT: 8082
      TRADE_HISTORY_CSV: /app/data/sim_trade_history.csv
      TRADE_STORE_BACKEND: ${SIM_TRADE_STORE_BACKEND:-csv}
    ports:
      - "8082:8082"
    volumes:
      - bot-sim-data:/app/data
    command: ["python", "run_sim_dashboard.py"]

volumes:
  bot-data:
  bot-sim-data:
